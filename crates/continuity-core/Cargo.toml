[package]
name = "continuity-core"
description = "Máquina de estados, roteamento e política de controle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { version = "0.3.0", path = "../protocol" }
transport = { version = "0.3.0", path = "../transport" }
windows-input = { version = "0.3.0", path = "../windows-input" }
file-transfer = { version = "0.3.0", path = "../file-transfer" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }

[lints]
workspace = true
