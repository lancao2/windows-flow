[package]
name = "windows-input"
description = "Captura, supressão e injeção de entrada no Windows (Fase 1)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { version = "0.3.0", path = "../protocol" }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62.2"
